<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skill games lab</title>
<link rel="stylesheet" href="../assets/css/base.css">
<style>
  :root{--plum:#6A388C;--plum-700:#55286F;--night:#1F0A30;--lilac:#A886CD;--lilac-300:#C9B3DD;--lilac-100:#F1EAF7;--wash:#FBF3FB;--ink:#2A1F33;--ink-2:#5A4A66;--rose:#CC3366;
    --font:"LINE Seed","Sarabun","Noto Sans Thai",system-ui,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--wash);color:var(--ink);font-family:var(--font)}
  body{height:100svh;display:flex;flex-direction:column;overflow-x:hidden}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:10px 16px 6px;max-width:1140px;width:100%;margin:0 auto}
  .bar h1{font-size:17px;font-weight:700;margin:0 auto 0 0;letter-spacing:-.01em}
  .seg{display:inline-flex;border:1px solid var(--lilac-300);border-radius:999px;padding:3px;background:#fff}
  .seg button{height:30px;padding:0 12px;border:0;border-radius:999px;background:none;font:600 13px/1 var(--font);color:var(--ink-2);cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--plum);color:#fff}
  .ctl{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
  .ctl input{width:84px;height:36px;border:1px solid var(--lilac-300);border-radius:999px;padding:0 12px;font:600 13px var(--font);color:var(--ink);background:#fff}
  .go{height:36px;padding:0 18px;border:0;border-radius:999px;background:var(--plum);color:#fff;font:700 14px/1 var(--font);cursor:pointer}
  .go:hover{background:var(--plum-700)}
  .hud{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:4px 16px 8px;max-width:1140px;width:100%;margin:0 auto}
  .hud .how{flex:1 1 100%;font-size:14px;color:var(--ink-2);margin:0 0 2px}
  .stat{display:inline-flex;align-items:baseline;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:#fff;box-shadow:0 0 0 1px rgba(106,56,140,.1);font-size:12.5px;color:var(--ink-2)}
  .stat b{font-size:15px;color:var(--plum);font-variant-numeric:tabular-nums;line-height:32px}
  .stage-wrap{flex:1 1 auto;display:flex;justify-content:center;align-items:flex-start;padding:0 16px 16px;min-height:0}
  .stage{position:relative;width:100%;max-width:1100px;height:100%;min-height:420px}
  @media (min-width:700px){body{height:auto;min-height:100svh}.stage{height:auto;min-height:0;aspect-ratio:16/10;width:min(1100px,100%,calc((100svh - 150px) * 1.6))}}
  .stage>div{position:absolute;inset:0}
  pre.result{flex:none;max-width:1140px;width:calc(100% - 32px);margin:0 auto 16px;padding:12px 14px;border-radius:12px;background:#fff;font-size:12px;white-space:pre-wrap;word-break:break-all;color:var(--ink-2);box-shadow:0 0 0 1px rgba(106,56,140,.1)}
  pre.result:empty{display:none}
  @media (max-width:699px){.bar h1{display:none}.ctl span{display:none}.ctl input{width:60px;padding:0 10px}.seg button{padding:0 10px}.go{padding:0 14px}.bar{gap:6px}#gameSeg{flex:1 1 100%;justify-content:space-between}#gameSeg button{flex:1}.hud .how{display:none}.stat{height:28px;padding:0 10px}.stat b{line-height:28px;font-size:14px}}
</style>
</head>
<body>
<div class="bar">
  <h1 id="ttl">Skill games lab</h1>
  <div class="seg" id="gameSeg">
    <button type="button" data-game="steady" aria-pressed="true">Steady Hand</button>
    <button type="button" data-game="proportion" aria-pressed="false">Proportion</button>
  </div>
  <label class="ctl"><span id="seedLbl">Seed</span><input id="seed" inputmode="numeric" value="1"></label>
  <div class="seg" id="langSeg">
    <button type="button" data-lang="th" aria-pressed="false">TH</button>
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
  </div>
  <div class="seg"><button type="button" id="snd" aria-pressed="false">Sound</button></div>
  <button type="button" class="go" id="go">Start</button>
</div>
<div class="hud">
  <p class="how" id="how"></p>
  <span class="stat"><span id="lScore">Score</span><b id="vScore">0</b></span>
  <span class="stat"><span id="lLevel">Level</span><b id="vLevel">1</b></span>
  <span class="stat"><span id="lLives">Lives</span><b id="vLives">3</b></span>
  <span class="stat"><span id="lTime">Time</span><b id="vTime">0.0</b></span>
</div>
<div class="stage-wrap"><div class="stage" id="stage"></div></div>
<pre class="result" id="out"></pre>

<script type="module">
import steady from '../assets/features/games/steady.js';
import proportion from '../assets/features/games/proportion.js';

const GAMES = { steady, proportion };
const UI = {
  en: { title: 'Skill games lab', seed: 'Seed', start: 'Start', sound: 'Sound', score: 'Score', level: 'Level', lives: 'Lives', time: 'Time' },
  th: { title: 'ทดสอบเกมทักษะ', seed: 'ซีด', start: 'เริ่ม', sound: 'เสียง', score: 'คะแนน', level: 'ระดับ', lives: 'ชีวิต', time: 'เวลา' },
};
const q = new URLSearchParams(location.search);
const state = {
  game: GAMES[q.get('game')] ? q.get('game') : 'steady',
  lang: q.get('lang') === 'th' ? 'th' : 'en',
  seed: q.get('seed') || '1',
  sound: false,
};
const $ = (id) => document.getElementById(id);
$('seed').value = state.seed;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seedNum(s) { let h = 2166136261; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

function paint() {
  const u = UI[state.lang];
  document.documentElement.lang = state.lang;
  $('ttl').textContent = u.title; $('seedLbl').textContent = u.seed; $('go').textContent = u.start; $('snd').textContent = u.sound;
  $('lScore').textContent = u.score; $('lLevel').textContent = u.level; $('lLives').textContent = u.lives; $('lTime').textContent = u.time;
  for (const b of document.querySelectorAll('#gameSeg button')) { b.textContent = GAMES[b.dataset.game].title[state.lang]; b.setAttribute('aria-pressed', b.dataset.game === state.game); }
  for (const b of document.querySelectorAll('#langSeg button')) b.setAttribute('aria-pressed', b.dataset.lang === state.lang);
  $('snd').setAttribute('aria-pressed', state.sound);
  $('how').textContent = GAMES[state.game].how[state.lang];
}

let ctrl = null;
function start() {
  if (ctrl) ctrl.abort();
  ctrl = new AbortController();
  const stage = $('stage');
  stage.innerHTML = '';
  const host = document.createElement('div');
  stage.appendChild(host);
  $('out').textContent = '';
  window.__result = null;
  window.__host = host;
  const game = GAMES[state.game];
  const seed = $('seed').value || '1';
  const onHud = (h) => {
    $('vScore').textContent = h.score; $('vLevel').textContent = h.level;
    $('vLives').textContent = h.lives ?? '-'; $('vTime').textContent = h.time != null ? h.time.toFixed(1) : '-';
  };
  game.run(host, {
    lang: state.lang, level: Math.max(1, +q.get('level') || 1), rng: mulberry32(seedNum(seed)), signal: ctrl.signal, onHud,
    muted: !state.sound, probe: q.has('probe'),
  }).then((res) => {
    window.__result = res;
    $('out').textContent = JSON.stringify({ ...res, log: `${res.log.length} entries` }, null, 1);
  }).catch((e) => { if (e.name !== 'AbortError') $('out').textContent = String(e); });
}

$('gameSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; state.game = b.dataset.game; paint(); start(); });
$('langSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; state.lang = b.dataset.lang; paint(); start(); });
$('snd').addEventListener('click', () => { state.sound = !state.sound; paint(); start(); });
$('go').addEventListener('click', start);
paint();
window.__start = start;
if (q.get('autostart') !== '0') start();
</script>
</body>
</html>
